# Default values for sonarr
# This is a YAML-formatted file.

# General configuration (passed from umbrella chart)
general:
  ingress_host: k8s-mediaserver.k8s.test
  podDistribution: cluster
  initContainer:
    image: docker.io/ubuntu
    tag: "26.04@sha256:d66b366dac61b575bee2aef07e9c26e8070096fbe84a3d4d3eb0da069b5d76db"
  puid: 911
  pgid: 1001
  storage:
    customVolume: false
    pvcName: mediaserver-pvc
    accessMode: ""
    pvcStorageClass: ""
    subPaths:
      tv: media/tv
      movies: media/movies
      downloads: downloads
      config: config
    # Mount the whole volume once (instead of separate subPath mounts for downloads
    # and the library). Required for hardlinks / atomic moves between the download
    # client folder and the library: link() fails across mount points (EXDEV).
    # When enabled, use "<path>/<subPaths.*>" inside the app (e.g. /data/media/tv).
    unifiedMount:
      enabled: false
      path: /data
    volumes: {}
  ingress:
    ingressClassName: ""
  nodeSelector: {}
  tolerations: []

# Sonarr specific configuration
container:
  image: docker.io/linuxserver/sonarr
  # https://hub.docker.com/r/linuxserver/sonarr/tags
  # https://github.com/linuxserver/docker-sonarr/releases/latest
  tag: ""
  nodeSelector: {}
  port: 8989
  extraEnv: []

service:
  type: ClusterIP
  port: 8989
  nodePort:
  # Defines an additional LB service, requires cloud provider service or MetalLB
  extraLbService:
    enabled: false
    annotations: {}
    port: 80
    loadBalancerIP:

ingress:
  enabled: true
  annotations: {}
  path: /sonarr
  tls:
    enabled: false
    secretName: ""

resources: {}

volume: {}
